[program:mars-act-supervisor]
command=/workspace/repos/before-we-act/deployment/mars_act/mars-act-supervisor.sh
autostart=true
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/var/log/portal/mars-act-supervisor.log
redirect_stderr=true
stdout_logfile_maxbytes=0

[program:mars-openvla-supervisor]
command=/opt/supervisor-scripts/mars-openvla-supervisor.sh
directory=/workspace/repos/before-we-act
autostart=true
autorestart=unexpected
startsecs=2
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0

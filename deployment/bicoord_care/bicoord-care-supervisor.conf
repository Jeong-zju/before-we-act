[program:bicoord-care-supervisor]
; Deliberately opt-in: installing this file does not launch a training job.
command=/opt/supervisor-scripts/bicoord-care-supervisor.sh run
directory=/workspace/repos/bicoord-bench
autostart=false
; The Python supervisor owns bounded per-stage retry (three attempts).  Never
; wrap a failed full pipeline in an unbounded process-level restart loop.
autorestart=false
startsecs=0
startretries=0
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PYTHONPATH="/workspace/repos/before-we-act:/workspace/repos/bicoord-bench",MUJOCO_GL="egl",HF_HOME="/workspace/.hf_home",WANDB_MODE="disabled",BICOORD_CARE_REPO="/workspace/repos/before-we-act",BICOORD_BENCH_REPO="/workspace/repos/bicoord-bench",BICOORD_DATASET="/workspace/repos/bicoord-bench/data",BICOORD_CARE_RUN="/workspace/runs/bicoord-care-v3",BICOORD_DINO_MODEL="/workspace/artifacts/dinov3-vitb16-pretrain-lvd1689m",BICOORD_CARE_PYTHON="/venv/main/bin/python"

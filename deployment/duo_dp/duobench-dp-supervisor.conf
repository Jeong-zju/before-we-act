[program:duobench-dp]
environment=PROC_NAME="%(program_name)s"
command=/workspace/repos/before-we-act/deployment/duo_dp/duobench-dp-supervisor.sh
directory=/workspace/repos/before-we-act
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=120
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0

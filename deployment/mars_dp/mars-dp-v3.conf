[program:mars_dp_v3]
directory=/workspace/repos/before-we-act
command=/venv/main/bin/python -m deployment.mars_dp.supervisor_v3
environment=PYTHONPATH="/workspace/repos/before-we-act:/workspace/repos/RoboFactory:/workspace/repos/RoboFactory/robofactory/policy/Diffusion-Policy",MARS_DP_RUN_ROOT="/workspace/runs/mars_dp_v3",CUDA_VISIBLE_DEVICES="0",WANDB_MODE="offline",TOKENIZERS_PARALLELISM="false"
autostart=false
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/runs/mars_dp_v3/logs/supervisor.log
stdout_logfile_maxbytes=0
redirect_stderr=true

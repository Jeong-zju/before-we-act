[program:bwa-duo-care-supervisor]
command=/bin/bash /workspace/repos/care-official/deployment/duo_care/bwa-duo-care-supervisor.sh
directory=/workspace/repos/care-official
environment=PYTHONPATH="/workspace/repos/care-official:/workspace/repos/duobench/src",MUJOCO_GL="egl",DUOBENCH_PREFIX="/workspace/repos/duobench",LD_LIBRARY_PATH="/venv/main/lib/python3.12/site-packages/mujoco",HF_HOME="/workspace/.hf_home",DUO_CARE_STEPS="20000"
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=120
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0

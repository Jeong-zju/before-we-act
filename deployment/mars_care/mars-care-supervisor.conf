[program:mars-care]
command=/bin/bash /workspace/repos/before-we-act/deployment/mars_care/mars-care-supervisor.sh
directory=/workspace/repos/before-we-act
autostart=false
autorestart=false
startretries=0
startsecs=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=120
stdout_logfile=/workspace/logs/mars-care-supervisor.log
stderr_logfile=/workspace/logs/mars-care-supervisor.err.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:mars_maniflow_fixed]
command=/workspace/repos/before-we-act/deployment/mars_maniflow/mars-maniflow-supervisor.sh
directory=/workspace/repos/before-we-act
autostart=false
autorestart=unexpected
startsecs=5
stdout_logfile=/workspace/runs/mars_maniflow_fixed/supervisor.log
stderr_logfile=/workspace/runs/mars_maniflow_fixed/supervisor.err.log
stopasgroup=true
killasgroup=true
environment=CUDA_VISIBLE_DEVICES="0",PYTHONUNBUFFERED="1",MARS_MANIFLOW_RUN_ROOT="/workspace/runs/mars_maniflow_fixed"

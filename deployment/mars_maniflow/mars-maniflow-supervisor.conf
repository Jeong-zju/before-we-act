[program:mars_maniflow]
command=/workspace/repos/before-we-act/deployment/mars_maniflow/mars-maniflow-supervisor.sh
directory=/workspace/repos/before-we-act
autostart=false
autorestart=false
startsecs=5
stdout_logfile=/workspace/runs/mars_maniflow/supervisor.log
stderr_logfile=/workspace/runs/mars_maniflow/supervisor.err.log
stopasgroup=true
killasgroup=true
environment=CUDA_VISIBLE_DEVICES="0",PYTHONUNBUFFERED="1"

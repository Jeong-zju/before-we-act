[program:duo-latent-tom]
command=/workspace/repos/before-we-act/deployment/duo_latent_tom/launch.sh
directory=/workspace/repos/before-we-act
environment=PYTHONPATH="/workspace/repos/before-we-act:/workspace/repos/LatentToM:/workspace/repos/duobench/src",CUDA_VISIBLE_DEVICES="0",MUJOCO_GL="egl",DUOBENCH_PREFIX="/workspace/repos/duobench",HF_HOME="/workspace/.hf_home",WANDB_MODE="disabled"
autostart=true
autorestart=unexpected
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/runs/duobench-latent-tom/logs/supervisor.log
redirect_stderr=true
stdout_logfile_maxbytes=0

[program:duobench-care-v2-gripper-supervisor]
command=/workspace/repos/care-v2-final/deployment/duo_dino_reference/duobench-care-v2-gripper-supervisor.sh
directory=/workspace/repos/care-v2-final
autostart=false
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PROC_NAME="%(program_name)s"

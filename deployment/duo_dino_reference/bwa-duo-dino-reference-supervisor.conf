[program:bwa-duo-dino-reference]
; Opt-in formal pipeline. Keep autostart disabled until the Duo-specific
; B-core and branch adapters have been installed and smoke-tested.
command=/bin/bash /workspace/repos/care-official/deployment/duo_dino_reference/bwa-duo-dino-reference-supervisor.sh
directory=/workspace/repos/care-official
autostart=false
autorestart=unexpected
startsecs=5
startretries=20
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=120
stdout_logfile=/workspace/runs/duobench-care-dino-v1/logs/supervisor.stdout.log
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PYTHONPATH="/workspace/repos/care-official:/workspace/repos/duobench/src",MUJOCO_GL="egl",DUOBENCH_PREFIX="/workspace/repos/duobench",HF_HOME="/workspace/.hf_home",WANDB_MODE="disabled",DUO_DINO_REPO="/workspace/repos/care-official",DUO_DINO_DUOBENCH_REPO="/workspace/repos/duobench",DUO_DINO_DATASET="/workspace/datasets/duobench",DUO_DINO_RUN="/workspace/runs/duobench-care-dino-v1",DUO_DINO_MODEL="/workspace/artifacts/dinov3-vitb16-pretrain-lvd1689m",DUO_DINO_PYTHON="/venv/main/bin/python"

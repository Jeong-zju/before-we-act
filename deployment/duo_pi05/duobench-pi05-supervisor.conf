[program:duobench-pi05-supervisor]
command=/workspace/repos/before-we-act/deployment/duo_pi05/run_supervisor.sh
directory=/workspace/repos/before-we-act
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PROC_NAME="%(program_name)s"

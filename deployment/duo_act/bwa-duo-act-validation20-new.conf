[program:bwa-duo-act-validation20-new]
command=/venv/main/bin/python -u -m deployment.duo_act.validation_launcher --checkpoint /workspace/runs/duobench-act/causal_lag1_prior/final.pt --data /workspace/runs/duobench-act/data_unclipped --output /workspace/runs/duobench-act/causal_lag1_prior/validation20_open30 --episodes 20 --workers 3 --mode open30
directory=/workspace/repos/before-we-act
environment=PYTHONPATH="/workspace/repos/before-we-act:/workspace/repos/duobench/src",CUDA_VISIBLE_DEVICES="0",MUJOCO_GL="egl",DUOBENCH_PREFIX="/workspace/datasets/duobench_assets",OMP_NUM_THREADS="8",MKL_NUM_THREADS="8"
autostart=true
autorestart=unexpected
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/workspace/runs/duobench-act/causal_lag1_prior/logs/validation20_open30_supervisor.log
redirect_stderr=true
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=2

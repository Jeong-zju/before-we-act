[program:bwa-duo-act-diagnostic]
command=/venv/main/bin/python -m deployment.duo_act.diagnostic_supervisor
directory=/workspace/repos/before-we-act
environment=PYTHONPATH="/workspace/repos/before-we-act:/workspace/repos/duobench/src",CUDA_VISIBLE_DEVICES="0",MUJOCO_GL="egl",DUOBENCH_PREFIX="/workspace/datasets/duobench_assets"
autostart=true
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/runs/duobench-act/causal_lag1_prior/logs/diagnostic_supervisor.log
redirect_stderr=true
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=2

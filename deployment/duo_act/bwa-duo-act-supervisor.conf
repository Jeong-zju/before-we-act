[program:bwa-duo-act]
command=/workspace/repos/before-we-act/deployment/duo_act/bwa-duo-act-supervisor.sh
directory=/workspace/repos/before-we-act
environment=PYTHONPATH="/workspace/repos/before-we-act:/workspace/repos/duobench/src",DUO_ACT_REPO="/workspace/repos/before-we-act",DUO_ACT_RUN="/workspace/runs/duobench-act",DUO_ACT_DATASET="/workspace/datasets/duobench"
autostart=true
autorestart=unexpected
startsecs=5
startretries=20
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

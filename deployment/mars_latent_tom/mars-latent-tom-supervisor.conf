[program:mars-latent-tom]
command=/workspace/repos/before-we-act/deployment/mars_latent_tom/launch.sh
directory=/workspace/repos/before-we-act
environment=PROC_NAME="%(program_name)s",PYTHONUNBUFFERED="1"
autostart=true
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=120
stdout_logfile=/var/log/portal/mars-latent-tom.log
stderr_logfile=/var/log/portal/mars-latent-tom.err.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:mars-care-h8-formal-collection]
command=/bin/bash /workspace/repos/care-mars-v2/scripts/before_we_act/run_mars_care_h8_formal_collection.sh
directory=/workspace/repos/care-mars-v2
environment=MARS_CARE_REPO="/workspace/repos/care-mars-v2",MARS_CARE_H8_FORMAL_ROOT="/workspace/runs/care_mars_optimization_v2/h8_fixed_stratified_formal_v1"
autostart=false
autorestart=false
startsecs=1
startretries=0
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/runs/care_mars_optimization_v2/h8_fixed_stratified_formal_v1/supervisor.log
stderr_logfile=/workspace/runs/care_mars_optimization_v2/h8_fixed_stratified_formal_v1/supervisor.err.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

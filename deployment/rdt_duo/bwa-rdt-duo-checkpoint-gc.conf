[program:bwa-rdt-duo-checkpoint-gc]
command=/workspace/repos/before-we-act/deployment/rdt_duo/checkpoint_gc.sh
directory=/workspace/repos/before-we-act
environment=PROC_NAME="%(program_name)s"
autostart=true
autorestart=true
startsecs=2
startretries=20
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/workspace/runs/rdt_duo/logs/checkpoint_gc.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

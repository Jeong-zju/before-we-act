[program:bwa-rdt-duo]
command=/workspace/repos/before-we-act/deployment/rdt_duo/bwa-rdt-duo-supervisor.sh
directory=/workspace/repos/before-we-act
environment=PROC_NAME="%(program_name)s",PYTHONPATH="/workspace/repos/before-we-act:/workspace/repos/duobench/src"
autostart=false
autorestart=unexpected
startsecs=5
startretries=20
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mars-care-branch-duration-smoke]
command=/bin/bash /workspace/repos/care-mars-v2/scripts/before_we_act/run_mars_care_branch_duration_smoke.sh
directory=/workspace/repos/care-mars-v2
environment=MARS_CARE_REPO="/workspace/repos/care-mars-v2",MARS_CARE_BRANCH_DURATION_ROOT="/workspace/runs/care_mars_optimization_v2/branch_duration_smoke_v1"
autostart=false
autorestart=false
startsecs=1
startretries=0
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/runs/care_mars_optimization_v2/branch_duration_smoke_v1/supervisor.log
stderr_logfile=/workspace/runs/care_mars_optimization_v2/branch_duration_smoke_v1/supervisor.err.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

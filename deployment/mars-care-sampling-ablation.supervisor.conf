[program:mars-care-sampling-ablation]
command=/bin/bash /workspace/repos/care-official/scripts/before_we_act/run_mars_care_sampling_ablation.sh
directory=/workspace/repos/care-official
autostart=true
autorestart=false
startsecs=1
startretries=0
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/runs/care_official_mars_v1/sampling_ablation/event_aware_hybrid_v1/supervisor.log
stderr_logfile=/workspace/runs/care_official_mars_v1/sampling_ablation/event_aware_hybrid_v1/supervisor.err.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

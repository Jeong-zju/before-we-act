[program:mars-care-v2-diagnostic]
command=/bin/bash /workspace/repos/care-mars-v2/scripts/before_we_act/run_mars_care_v2_diagnostic.sh
directory=/workspace/repos/care-mars-v2
environment=MARS_CARE_REPO="/workspace/repos/care-mars-v2",MARS_CARE_PREPARED="/workspace/runs/care_official_mars_v1/care_prepared.pt",MARS_CARE_V2_DIAGNOSTIC_ROOT="/workspace/runs/care_mars_optimization_v2/scorer_family_disjoint"
autostart=false
autorestart=false
startsecs=1
startretries=0
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/runs/care_mars_optimization_v2/scorer_family_disjoint/supervisor.log
stderr_logfile=/workspace/runs/care_mars_optimization_v2/scorer_family_disjoint/supervisor.err.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

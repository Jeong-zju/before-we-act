[program:bwa_b3_n1]
environment=PROC_NAME="%(program_name)s"
command=/workspace/fe-pc-wam-b-core/scripts/before_we_act/supervisor_b3_n1.sh
directory=/workspace/fe-pc-wam-b-core
autostart=false
autorestart=unexpected
startsecs=5
startretries=3
stopsignal=INT
stopwaitsecs=120
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0

[program:care-dino-mars-validation20]
environment=PROC_NAME="%(program_name)s"
directory=/workspace/repos/care-official
command=/bin/bash /workspace/repos/care-official/scripts/before_we_act/run_care_dino_mars_validation20.sh
autostart=true
autorestart=unexpected
startsecs=5
stdout_logfile=/workspace/runs/care_dino_mars/validation20_supervisor.log
stderr_logfile=/workspace/runs/care_dino_mars/validation20_supervisor.err.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

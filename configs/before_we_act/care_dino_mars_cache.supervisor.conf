[program:care-dino-mars-cache]
environment=PROC_NAME="%(program_name)s"
directory=/workspace/repos/care-official
command=/workspace/venvs/mars/bin/python -m torch.distributed.run --standalone --nproc_per_node=2 -m before_we_act.cache_mars_dino --raw-root /workspace/datasets/mars_control/raw --dino-model /workspace/artifacts/dinov3-vitb16-pretrain-lvd1689m --output /workspace/runs/care_dino_mars/dino_cache --batch-size 32
autostart=true
autorestart=unexpected
startsecs=5
stdout_logfile=/workspace/runs/care_dino_mars/cache.log
stderr_logfile=/workspace/runs/care_dino_mars/cache.err.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

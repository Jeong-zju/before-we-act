[program:p1_place_food_activate]
command=/venv/robofactory-act/bin/python -u /workspace/fe-pc-wam-step2/scripts/before_we_act/activate_place_food_revision.py
directory=/workspace/fe-pc-wam-step2
autostart=false
autorestart=unexpected
startsecs=5
startretries=1
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/log/portal/p1_place_food_activate.log
stdout_logfile_maxbytes=104857600
stdout_logfile_backups=3


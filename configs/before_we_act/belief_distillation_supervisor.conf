[program:bwa_belief_distillation]
environment=PROC_NAME="%(program_name)s"
command=/workspace/fe-pc-wam/scripts/before_we_act/supervisor_belief_distillation.sh
directory=/workspace/fe-pc-wam
autostart=false
autorestart=unexpected
startretries=1
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=120

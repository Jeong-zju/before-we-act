[program:bwa_action_grounded_probe]
environment=PROC_NAME="%(program_name)s"
command=/workspace/fe-pc-wam/scripts/before_we_act/supervisor_action_grounded_probe.sh
directory=/workspace/fe-pc-wam
autostart=false
autorestart=unexpected
startsecs=5
startretries=2
stopsignal=INT
stopwaitsecs=120
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0

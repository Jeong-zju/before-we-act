[program:bwa_predictive_team_belief]
environment=PROC_NAME="%(program_name)s"
command=/workspace/fe-pc-wam/scripts/before_we_act/supervisor_predictive_team_belief.sh
directory=/workspace/fe-pc-wam
autostart=false
autorestart=unexpected
startretries=1
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=180

[program:bwa_raw_team_signal]
environment=PROC_NAME="%(program_name)s"
command=/workspace/fe-pc-wam/scripts/before_we_act/supervisor_raw_team_signal.sh
directory=/workspace/fe-pc-wam
autostart=false
autorestart=unexpected
startsecs=5
startretries=3
stopsignal=INT
stopwaitsecs=120
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0

version: wam.cooperative_stop/2
phase: phase2_rwm_u

data:
  directory: datasets/cooperative_stop_wam_proprio_v1/hdf5
  schema_version: wam.proprio/1.0
  state_dim: 22
  action_dim: 8
  history_horizon: 32
  train_forecast_horizon: 16
  planning_horizon: 20
  split_seed: 7
  allow_legacy_wam: false

state_features:
  yaw_indices: [2, 13]
  gripper_closed_indices: [7, 18]
  yaw_encoding: sin_cos
  predict_delta: true

model:
  family: rwm_u
  ensemble_size: 5
  bootstrap: true
  encoder_hidden_dim: 256
  gru_hidden_dim: 256
  gru_layers: 2
  dropout: 0.0
  min_log_std: -8.0
  max_log_std: 2.0
  heads:
    - state_delta_gaussian
    - reward
    - done
    - success
    - failure

risk:
  epistemic_weight: 1.0
  aleatoric_weight: 0.1
  failure_weight: 1.0
  action_ood_weight: 0.5
  action_ood_threshold: 3.0

training:
  mode: autoregressive
  forecast_curriculum: [1, 4, 8, 16]
  curriculum_epochs: [1, 2, 3, 4]
  batch_size: 256
  num_workers: 4
  seed: 7
  member_seed_stride: 1009
  learning_rate: 0.0003
  weight_decay: 0.00001
  gradient_clip_norm: 10.0
  horizon_decay: 0.95
  use_amp: true
  preload_data: true
  teacher_forcing_ablation: true
  loss_weights:
    state_mean: 1.0
    state_nll: 0.1
    gripper_closed: 1.0
    reward: 0.1
    done: 0.1
    terminal: 0.1
    auxiliary: 0.05
  terminal_positive_weight_source: train
  privileged_inputs: false

evaluation:
  open_loop_horizons: [1, 5, 10, 20, 40]
  validation_max_batches: -1
  evaluation_max_batches: -1
  variance_scale_min: 0.05
  variance_scale_max: 20.0
  event_horizon: 5
  event_progress_min: 0.01
  event_slowdown_min: 0.001
  event_asymmetry_min: 0.001
  event_ambiguity_fraction: 0.25
  ood_action_scale: 2.5
  ood_action_offset_std: 4.0
  ood_action_low: -1.0
  ood_action_high: 1.0
  gate_c_horizon: 20
  gate_c_mlp_improvement_min: 0.20
  gate_c_ar_over_teacher_forcing_min: 0.05
  gate_c_uncertainty_error_spearman_min: 0.30
  gate_c_ood_auroc_min: 0.70
  gate_c_ood_epistemic_ratio_min: 1.25
  gate_c_event_dominant_agent_accuracy_min: 0.60
  gate_c_event_ambiguous_rate_max: 0.25

checkpoint:
  format_version: wam.rwm_u/1
  directory: checkpoints/wam_cooperative_stop_phase2_rwm_u_v1
  weights_format: safetensors

phase1_reference:
  checkpoint: checkpoints/wam_cooperative_stop_v1
  open_loop_metrics: outputs/wam_phase1_open_loop_v1/open_loop_metrics.json

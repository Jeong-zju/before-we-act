version: wam.action_prior/1
pipeline: action_prior

data:
  directory: datasets/cooperative_stop_wam_proprio/hdf5
  schema_version: wam.proprio/1.0
  split_seed: 7

world_model:
  checkpoint: checkpoints/joint_wam/initialization/world_model

model:
  hidden_dim: 256
  hidden_layers: 2
  min_log_std: -5.0
  max_log_std: 1.0

training:
  epochs: 10
  batch_size: 512
  num_workers: 4
  seed: 17
  learning_rate: 0.0003
  weight_decay: 0.00001
  gradient_clip_norm: 10.0
  discount: 0.99
  require_success: true
  min_return_quantile: 0.25
  behavior_weights:
    scripted_oracle_v1: 1.0
    oracle_ou_noise_v1: 0.75
    delayed_response_v1: 0.50
    response_rate_v1: 0.50
    smooth_random_v1: 0.10
    counterfactual_stop_v1: 0.0
    induced_failure_v1: 0.0

runtime:
  fixed_actions:
    3: 1.0
    7: 1.0

checkpoint:
  format_version: wam.action_prior/1
  directory: checkpoints/joint_wam/initialization/action_prior
  weights_format: safetensors

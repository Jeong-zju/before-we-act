version: wam.cooperative_stop/3.1
phase: phase3_wam_mppi

data:
  directory: datasets/cooperative_stop_wam_proprio_v1/hdf5
  schema_version: wam.proprio/1.0
  state_dim: 22
  action_dim: 8
  history_horizon: 32
  split_seed: 7
  allow_legacy_wam: false

phase2:
  checkpoint: checkpoints/wam_cooperative_stop_phase2_rwm_u_v1
  uncertainty_calibration: outputs/wam_phase2_uncertainty_v1/uncertainty_calibration.json

planning_heads:
  hidden_dim: 256
  hidden_layers: 2
  min_log_std: -5.0
  max_log_std: 1.0

training:
  epochs: 10
  batch_size: 512
  num_workers: 4
  seed: 17
  learning_rate: 0.0003
  weight_decay: 0.00001
  gradient_clip_norm: 10.0
  discount: 0.99
  value_target: discounted_monte_carlo
  action_prior_weight: 1.0
  value_weight: 1.0
  action_prior_require_success: true
  action_prior_min_return_quantile: 0.25
  action_prior_behavior_weights:
    scripted_oracle_v1: 1.0
    oracle_ou_noise_v1: 0.75
    delayed_response_v1: 0.50
    response_rate_v1: 0.50
    smooth_random_v1: 0.10
    counterfactual_stop_v1: 0.0
    induced_failure_v1: 0.0

planner:
  planning_horizon: 20
  num_samples: 512
  num_elites: 64
  iterations: 4
  num_policy_trajectories: 32
  particles_per_candidate: 5
  candidate_batch_size: 128
  temperature: 0.5
  min_std: 0.05
  max_std: 1.0
  initial_std: 0.1
  discount: 0.99
  cvar_alpha: 0.20
  cvar_weight: 0.25
  warm_start: true
  prior_action_max_delta: 0.15
  terminal_value_weight: 0.0
  execute_steps: 1
  fixed_actions:
    3: 1.0
    7: 1.0

risk:
  epistemic: 1.0
  aleatoric: 0.1
  failure: 2.0
  action_ood: 0.5
  action_magnitude: 0.01
  action_change: 0.05

safety:
  latency_budget_ms: 50.0
  max_epistemic: 0.5
  max_action_ood: 1.0
  max_failure_probability: 0.9
  reduced_num_samples: 128
  reduced_num_elites: 16
  reduced_iterations: 2
  reduced_particles: 1
  recovery_steps: 20
  sticky_latency_fallback: true
  discard_over_budget_plans: true
  max_predicted_robot_distance: 1.15

evaluation:
  gate_d_protocol: standard_noninferiority_v2
  held_out_seed_start: 100000
  episodes: 500
  policies: [wam_mppi, action_prior, stationary, scripted_oracle]
  randomize: true
  gate_d_minimum_episodes: 500
  gate_d_success_regression_max: 0.01
  gate_d_return_regression_max: 0.5
  gate_d_mppi_execution_rate_min: 0.50
  gate_d_model_exploitation_max: 0
  exploitation_predicted_return_min: 10.0
  exploitation_actual_return_max: 0.0
  output_directory: outputs/wam_phase3_closed_loop_v2

checkpoint:
  format_version: wam.mppi_heads/1
  directory: checkpoints/wam_cooperative_stop_phase3_wam_mppi_v1
  weights_format: safetensors

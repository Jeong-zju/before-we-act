version: wam.phase0/1

data:
  schema_version: wam.proprio/1.0
  state_dim: 22
  action_dim: 8
  history_horizon: 32
  forecast_horizon: 16
  split:
    unit: episode_seed
    train: 0.8
    validation: 0.1
    test: 0.1

models:
  enabled: [linear, mlp, action_prior]
  hidden_dim: 256
  hidden_layers: 3

optimization:
  batch_size: 256
  epochs: 10
  learning_rate: 0.0003
  weight_decay: 0.00001
  reward_weight: 0.1
  done_weight: 0.1

runtime:
  rich_progress: true

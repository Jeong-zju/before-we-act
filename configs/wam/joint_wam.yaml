name: wam.cooperative_stop/joint-wam

data:
  directory: datasets/cooperative_stop_wam_proprio/hdf5
  schema_version: wam.proprio/1.0
  split_manifest: checkpoints/joint_wam/initialization/world_model/dataset_manifest.json
  state_dim: 22
  action_dim: 8
  history_horizon: 32
  split_seed: 7

initialization:
  world_model_checkpoint: checkpoints/joint_wam/initialization/world_model
  action_prior_checkpoint: checkpoints/joint_wam/initialization/action_prior
  generated_action_teacher: frozen_world_model

action_chunk:
  horizon: 8
  execution_steps: 2
  solver_steps: 4
  solver: euler
  expert_count: 1
  warm_start_mode: shift_repeat_last
  warm_start_shift_source: actual_executed_steps

action_flow:
  model:
    hidden_dim: 512
    hidden_layers: 4
    time_embedding_dim: 32
  training:
    epochs: 10
    batch_size: 512
    num_workers: 4
    seed: 31
    learning_rate: 0.0003
    weight_decay: 0.00001
    gradient_clip_norm: 10.0
    use_amp: true
    warm_start_probability: 0.5
    warm_start_noise_std: 0.05
    cold_noise_std: 1.0
    cold_zero_probability: 0.5
    endpoint_weight: 1.0
    smoothness_weight: 0.01
    action_prior_distillation_steps: 8
    action_prior_distillation_blend: 1.0
    quality_discount: 0.99
    action_quality_require_success: true
    action_quality_min_return_quantile: 0.25
    action_quality_behavior_weights:
      scripted_oracle_v1: 1.0
      oracle_ou_noise_v1: 0.75
      delayed_response_v1: 0.50
      response_rate_v1: 0.50
      smooth_random_v1: 0.10
      counterfactual_stop_v1: 0.0
      induced_failure_v1: 0.0
  on_policy_distillation:
    rounds: 2
    episodes_per_suite: 16
    standard_seed_start: 300000
    challenge_seed_start: 400000
    epochs: 15
    batch_size: 256
    learning_rate: 0.00002
    weight_decay: 0.00001
    gradient_clip_norm: 10.0
    cold_replay_probability: 0.10
    warm_start_noise_std: 0.005
    endpoint_weight: 1.0
    smoothness_weight: 0.01
    solver_endpoint_weight: 10.0
    offline_replay_weight: 1.0
    use_amp: true

joint_training:
  batch_size: 128
  num_workers: 4
  seed: 47
  weight_decay: 0.00001
  gradient_clip_norm: 5.0
  use_amp: true
  horizon_decay: 0.95
  warm_start_probability: 0.5
  warm_start_noise_std: 0.01
  cold_noise_std: 1.0
  cold_zero_probability: 0.5
  generated_warm_start_probability: 0.5
  normalized_action_clip: 10.0
  anchor_residual_scale: 0.10
  branch_gradient_audit_interval: 32
  action_quality_discount: 0.99
  action_quality_require_success: true
  action_quality_min_return_quantile: 0.25
  action_quality_behavior_weights:
    scripted_oracle_v1: 1.0
    oracle_ou_noise_v1: 0.75
    delayed_response_v1: 0.50
    response_rate_v1: 0.50
    smooth_random_v1: 0.10
    counterfactual_stop_v1: 0.0
    induced_failure_v1: 0.0
  loss_weights:
    action_flow: 1.0
    action_endpoint: 1.0
    action_smoothness: 0.01
    expert_world: 0.10
    generated_consistency: 0.10
    generated_risk: 0.10
    generated_progress: 0.05
    state_mean: 1.0
    state_nll: 0.1
    gripper_closed: 1.0
    reward: 0.1
    done: 0.1
    terminal: 0.1
    auxiliary: 0.05
  stages:
    - name: coupling_warmup
      scope: flow_only
      steps: 64
      action_learning_rate: 0.00002
      world_model_learning_rate: 0.0
    - name: world_heads_coupling
      scope: world_heads
      steps: 128
      action_learning_rate: 0.00002
      world_model_learning_rate: 0.000001
    - name: full_joint_coupling
      scope: full_joint
      steps: 512
      action_learning_rate: 0.00002
      world_model_learning_rate: 0.0000005

runtime:
  anchor_residual_scale: 0.10
  normalized_action_clip: 10.0
  observation_residual_nrmse_max: 3.0
  risk_veto: true
  max_failure_probability: 0.9
  max_predicted_robot_distance: 1.15
  max_action_ood: 1.0
  action_ood_threshold: 3.0
  latency_budget_ms: 50.0
  fixed_actions:
    3: 1.0
    7: 1.0

offline_acceptance:
  maximum_expert_world_nrmse: 0.11
  maximum_generated_teacher_state_nrmse: 0.10

checkpoint:
  format_version: wam.joint_wam/1
  directory: checkpoints/joint_wam
  warmup_directory: checkpoints/joint_wam/.action_flow_warmup
  weights_format: safetensors

evaluation:
  episodes_per_suite: 500
  standard_seed_start: 120000
  challenge_seed_start: 220000
  policies:
    - joint_wam_direct
    - action_prior
    - stationary
    - scripted_oracle
  same_seeds_for_all_policies: true
  randomize: true
  challenge_environment:
    brake_start_time_min: 1.0
    brake_start_time_max: 2.0
    max_response_time: 3.0
    max_linear_acceleration: 0.65
    max_pre_brake_speed_error: 0.08
  output_directory: outputs/joint_wam

acceptance:
  minimum_episodes_per_suite: 500
  minimum_direct_success_rate: 0.90
  maximum_prior_success_regression: 0.10
  required_direct_execution_rate: 1.0
  required_fallback_trigger_rate: 0.0
  require_all_policies: true
  require_flow_residual_applied: true
  require_all_actions_finite_and_bounded: true
  require_no_privileged_state_leakage: true
  require_no_premature_stationary_success: true
  require_held_out_seed_overlap_zero: true
  require_strict_joint_evidence: true
  require_source_checkpoint_immutability: true
  require_strict_checkpoint_reload: true
  require_required_videos: true
  policy_acceptable_on_all_checks: true
  joint_benefit_required: false

fallback_deployment:
  report_required: true
  policy: joint_wam_with_fallback
  fallback_enabled: true
  use_same_seeds: true
  blocking: false

video:
  source_policy: joint_wam_direct
  fallback_enabled: false
  success_per_suite: 3
  failure_global_max: 3
  selection: sorted_smallest_seed
  camera: fixed
  width: 640
  height: 360
  codec: mp4v
  annotated: true
  include_terminal_frame: true
  sidecar_required: true
  sidecar_fields:
    - suite
    - seed
    - success
    - failure
    - failure_reason
    - action_source
    - fallback_enabled
  verify_replay_matches_formal_episode: true

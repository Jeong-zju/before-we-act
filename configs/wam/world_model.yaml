version: wam.world_model/1
pipeline: world_model

data:
  directory: datasets/cooperative_stop_wam_proprio/hdf5
  schema_version: wam.proprio/1.0
  state_dim: 22
  action_dim: 8
  history_horizon: 32
  train_forecast_horizon: 16
  planning_horizon: 20
  split_seed: 7
  allow_legacy_wam: false

state_features:
  yaw_indices: [2, 13]
  gripper_closed_indices: [7, 18]
  yaw_encoding: sin_cos
  predict_delta: true

model:
  family: rwm_ar
  encoder_hidden_dim: 256
  gru_hidden_dim: 256
  gru_layers: 2
  dropout: 0.0
  min_log_std: -8.0
  max_log_std: 2.0
  heads:
    - state_delta_gaussian
    - reward
    - done
    - success
    - failure

training:
  mode: autoregressive
  forecast_curriculum: [1, 4, 8, 16]
  curriculum_epochs: [1, 2, 3, 4]
  batch_size: 256
  num_workers: 4
  seed: 7
  learning_rate: 0.0003
  weight_decay: 0.00001
  overfit_refine_epochs: 50
  overfit_refine_learning_rate: 0.0003
  gradient_clip_norm: 10.0
  horizon_decay: 0.95
  normalization_std_floor: 0.001
  use_amp: true
  preload_data: true
  loss_weights:
    state_mean: 1.0
    state_nll: 0.1
    gripper_closed: 1.0
    reward: 0.1
    done: 0.1
    terminal: 0.1
    auxiliary: 0.05
  terminal_positive_weight_source: train
  privileged_inputs: false

evaluation:
  open_loop_horizons: [1, 5, 10, 20, 40]
  acceptance_rollout_horizon: 16
  acceptance_overfit_nrmse_max: 0.02
  acceptance_overfit_closed_rmse_max: 0.05
  acceptance_constraint_violation_max: 0.0
  validation_max_batches: 100
  evaluation_max_batches: -1
  event_aligned: true
  compare_against:
    - constant_velocity
    - linear_baseline
    - mlp_baseline

checkpoint:
  format_version: wam.rwm_ar/1
  directory: checkpoints/joint_wam/initialization/world_model
  weights_format: safetensors

baseline_reference:
  config: configs/wam/baselines.yaml
  metrics: outputs/baselines/baseline_metrics.json

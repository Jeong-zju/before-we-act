# Frozen GauDP configuration used for the six-task RoboFactory run.
# Keep this file synchronized with the policy constructor and the run manifest.
policy: gaudp
contract: shared_weights_decentralized_local_rgb_qpos_to_local_action8

data:
  dataset_root: /workspace/datasets/robofactory_multitask
  use_all_episodes: true
  episodes_per_task: 150
  tasks: [lift_barrier, camera_alignment, long_pipeline_delivery, take_photo, pass_shoe, place_food]
  local_agent_streams: 2550
  samples: 795727
  horizon: 8
  observation_steps: 3
  image_size: [120, 160]
  action_dim: 8
  proprioception_dim: 9
  no_peer_rgb: true
  no_global_state: true
  no_joint_action: true

cache:
  cache_root: /workspace/bwa_gau_dp_data/cache
  precompute_batch_size: 48
  compression: none
  gaussian_dtype: float16
  rgb_dtype: uint8
  gaussian_channels: 13
  encoder_coordinate_type: self

optimization:
  seed: 20260822
  epochs: 100
  requested_batch_size: 128
  requested_gradient_accumulation: 1
  micro_batch_size: 32
  gradient_accumulation: 4
  effective_batch_size: 128
  num_workers: 8
  shuffle: true
  pin_memory: true
  persistent_workers: true
  precision: bf16-mixed
  gradient_clip_val: 1.0
  optimizer: AdamW
  learning_rate: 0.0001
  betas: [0.95, 0.999]
  epsilon: 0.00000001
  weight_decay: 0.000001
  scheduler: cosine
  warmup_steps: 500

diffusion:
  train_timesteps: 100
  beta_start: 0.0001
  beta_end: 0.02
  beta_schedule: squaredcos_cap_v2
  variance_type: fixed_small
  clip_sample: true
  prediction_type: epsilon
  inference_steps: 100

policy_architecture:
  observation_as_global_condition: true
  action_horizon: 8
  action_steps: 6
  diffusion_step_embed_dim: 128
  down_dims: [256, 512, 1024]
  kernel_size: 5
  groups: 8
  condition_predict_scale: true
  pre_fuse_gaussian: true
  skip_gaussian_encoder: true

rgb_encoder:
  architecture: MultiImageObsEncoder
  backbone: resnet18
  pretrained: false
  resize_shape: null
  crop_shape: null
  random_crop: false
  use_group_norm: true
  share_rgb_model: false
  imagenet_normalization: true

gaussian_encoder:
  architecture: NoPoSplat
  coordinate_type: self
  pretrained_weights: /workspace/repos/Policy-Lightning/weights/noposplat.ckpt
  num_monocular_samples: 32
  num_surfaces: 1
  predict_opacity: false
  gaussians_per_pixel: 1
  scale_min: 0.5
  scale_max: 15.0
  spherical_harmonics_degree: 4
  feature_dim: 128
  apply_bounds_shim: true
  params_head: dpt_gs
  pose_free: true
  opacity_mapping_initial: 0.0
  opacity_mapping_final: 0.0
  opacity_mapping_warmup: 1
  backbone: croco
  backbone_model: ViTLarge_BaseDecoder
  patch_embed: PatchEmbedDust3R
  asymmetric_decoder: true
  intrinsics_embed_location: encoder
  intrinsics_embed_degree: 4
  intrinsics_embed_type: token
  gaussian_cnn_input_channels: 13

runtime:
  accelerator: gpu
  devices: 1
  gpu: 0
  logger: csv
  progress_bar: false
  log_every_n_steps: 10
  checkpoint_every_n_epochs: 5
  checkpoint_save_last: true
  checkpoint_save_all: true
  ema_decay: 0.9
  ema_update_after_steps: 0
  eta_warmup_steps: 50
  eta_measurement_steps: 200
  output: /workspace/bwa_gau_dp_runs/formal/gaudp

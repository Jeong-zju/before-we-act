version: wam.multimodal.m0/2
phase: M0

dataset:
  directory: datasets/mujoco_visual_required_wam_multimodal_m0
  schema_profile: wam_multimodal
  schema_version: wam.multimodal/1.1
  dataset_card: docs/FE_PC_WAM_PHASE_M0_DATASET_CARD_V1.0_ZH.md
  formats: [hdf5, mp4]
  camera_order: [fixed, robot_0_camera, robot_1_camera]
  collection_policy: privileged_scripted_oracle
  episodes_per_task: 800
  cue_variants: [0, 1]
  physical_seed_start: 500000
  split:
    unit: physical_seed_pair
    train:
      physical_seeds: 300
      episodes: 600
      template_ids: [train_a, train_b]
    validation:
      physical_seeds: 50
      episodes: 100
      template_ids: [validation_a]
    test:
      physical_seeds: 50
      episodes: 100
      template_ids: [test_a]

camera:
  camera_order: [fixed, robot_0_camera, robot_1_camera]
  width: 256
  height: 256
  channels: 3
  image_hz: 10.0
  control_hz: 20.0
  codec: mp4v
  renderer_backend: mujoco.Renderer
  geometry_source: mujoco_xml
  raw_unannotated: true
  calibration_model: pinhole
  calibration_convention: opencv_optical_camera_pose_in_world
  static_extrinsics: [fixed]
  dynamic_extrinsics: [robot_0_camera, robot_1_camera]

collection:
  randomize: true
  max_steps: 160
  action_history: 4
  render_only_configured_cameras: true
  fail_if_output_exists: true
  rich_progress: true

audit:
  report: outputs/phase_m0_mujoco/multimodal_dataset_audit.json
  loader_history_horizon: 4
  maximum_errors_reported: 100
  expected_captured_frame_reuse_fraction: 0.5
  captured_frame_reuse_tolerance: 0.05
  maximum_unexpected_duplicate_rate: 0.05
  maximum_empty_frame_rate: 0.0
  maximum_corrupt_videos: 0
  require_cross_camera_frame_sync: true
  require_dynamic_robot_camera_extrinsics: true
  dynamic_extrinsics_min_translation_m: 0.001
  static_extrinsics_max_abs_delta: 0.000001
  minimum_visual_signal_changed_pixels: 4
  require_visual_signal_in_every_camera: true
  required_source_files:
    - envs/visual_required_env.py
    - envs/two_robot_carry_env.py
    - envs/runtime.py
    - envs/mujoco_camera.py
    - envs/assets/two_robot_carry.xml
    - data/trajectory.py
    - data/exporters/hdf5.py
    - policies/visual_required.py
    - scripts/collect_wam_multimodal_dataset.py
    - scripts/audit_wam_multimodal_dataset.py
    - scripts/evaluate_visual_required.py
    - scripts/accept_phase_m0.py
    - train/multimodal_trajectory_dataset.py
    - eval/visual_required.py

benchmark:
  output_directory: outputs/phase_m0_mujoco/visual_required
  physical_seeds_per_task: 50
  physical_seed_start: 600000
  cue_variants: [0, 1]
  policies:
    - state_only
    - privileged_scripted_oracle
    - vision_oracle
    - vision_oracle_opposite_rgb
  randomize: true
  max_steps: 160
  action_history: 4
  shuffle_mode: opposite_cue_derangement
  require_identical_seed_pairs: true
  camera_order: [fixed, robot_0_camera, robot_1_camera]
  policy_rgb_stream: fixed
  record_all_view_evidence: true

legacy_regression:
  checkpoint: checkpoints/joint_wam
  expected_checkpoint_tree_sha256: 1c5fc531522163a3f46d065b23b5227ffa32a556451eb729abb2f88198a4d482
  device: cpu
  episodes_per_suite: 20
  standard_seed_start: 120000
  challenge_seed_start: 220000
  expected_schema_version: wam.proprio/1.0
  minimum_success_rate: 1.0
  maximum_reference_regression: 0.0
  reference_success_rate:
    standard: 1.0
    challenge: 1.0

acceptance:
  report: outputs/phase_m0_mujoco/phase_m0_acceptance.json
  capture_sync_skew_p99_seconds:
    operator: "<"
    value: 0.025
  maximum_action_frame_age_seconds:
    operator: "<="
    value: 0.1
  maximum_state_only_success_rate:
    operator: "<="
    value: 0.70
  minimum_scripted_oracle_success_rate:
    operator: ">="
    value: 0.95
  minimum_vision_oracle_success_rate:
    operator: ">="
    value: 0.95
  minimum_opposite_rgb_success_drop:
    operator: ">="
    value: 0.20
  require_each_task_pass: true
  require_macro_pass: true
  require_zero_episode_boundary_crossings: true
  require_zero_split_seed_overlap: true
  require_zero_split_template_overlap: true
  require_no_privileged_policy_inputs: true
  require_legacy_checkpoint_immutable: true
  require_strict_checkpoint_reload: true
  require_mujoco_renderer_provenance: true
  require_three_camera_dataset: true
  require_three_camera_benchmark: true
  require_cross_camera_sync: true
  require_dynamic_robot_camera_extrinsics: true
  require_raw_unannotated_rgb: true
  require_visual_signal_onset_evidence: true
  require_visual_event_signal_semantic_isolation: true
  require_brake_lights_action_causal_and_red_only: true

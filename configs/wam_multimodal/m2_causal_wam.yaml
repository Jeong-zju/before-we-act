name: wam.robofactory/m2-block-causal-multitask
format_version: wam.robofactory.m2.config/4

# Phase M2 consumes only upstream RoboFactory tasks.  No fe_pc_wam custom
# VisualRequiredEnv/MuJoCo scene is accepted by the dataset loader.
data:
  manifests:
    - datasets/robofactory_multitask/camera_alignment/training_manifest.json
    - datasets/robofactory_multitask/lift_barrier/training_manifest.json
    - datasets/robofactory_multitask/long_pipeline_delivery/training_manifest.json
    - datasets/robofactory_multitask/pass_shoe/training_manifest.json
    - datasets/robofactory_multitask/pick_meat/training_manifest.json
    - datasets/robofactory_multitask/place_food/training_manifest.json
    - datasets/robofactory_multitask/stack_cube/training_manifest.json
    - datasets/robofactory_multitask/strike_cube/training_manifest.json
    - datasets/robofactory_multitask/take_photo/training_manifest.json
    - datasets/robofactory_multitask/three_robots_stack_cube/training_manifest.json
    - datasets/robofactory_multitask/two_robots_stack_cube/training_manifest.json
  minimum_tasks: 8
  state_history: 16
  action_horizon: 32
  task_action_horizons:
    camera_alignment: 16
    lift_barrier: 16
    long_pipeline_delivery: 32
    pass_shoe: 32
    pick_meat: 16
    place_food: 32
    stack_cube: 16
    strike_cube: 8
    take_photo: 32
    three_robots_stack_cube: 32
    two_robots_stack_cube: 32
  visual_history_frames: 4
  future_visual_horizons: [1, 4, 8, 16, 32]
  camera_order: [global]
  max_agents: 4
  max_state_dim: 72
  max_action_dim: 32
  max_text_tokens: 96
  stride: 1
  smoke_stride: 16
  hdf5_cache_size: 16

vision:
  encoder_name: dinov3_vitl16_lvd
  model_id: facebook/dinov3-vitl16-pretrain-lvd1689m
  revision: dd0a398fa8e84f2a37179332f6c561d20276300b
  config_path: artifacts/vision/dinov3_vitl16_lvd/config.json
  weights_path: artifacts/vision/dinov3_vitl16_lvd/model.safetensors
  expected_config_sha256: ce962b0c8ca4f2deb48c6fdfd6035257e3769f1d4d9154c92aba51991e46e290
  expected_weights_sha256: dcb2e45127cccbf1601e5f42fef165eea275c8e5213197e8dcf3f48822718179
  preprocess_id: dinov3_imagenet_rgb_resize_square_antialias_v1
  input_size: 256
  inference_batch_size: 64

# 12 pre-norm Transformer blocks plus the two-layer text adapter contain
# 180,255,096 trainable parameters; the frozen DINOv3 teacher is not counted.
model:
  visual_feature_dim: 1024
  text_vocab_size: 257
  d_model: 1024
  num_layers: 12
  num_heads: 16
  ffn_dim: 4096
  text_layers: 2
  dropout: 0.0

# This is a checkpointed train/deploy contract.  The initial LiftBarrier gate
# intentionally uses one cold Euler step: it removes iterative-solver mismatch
# while preserving the flow-matching regularizer.  Solver depth and warm-start
# are experiments only after the single-task closed-loop gate passes.
action_generation:
  solver_steps: 1
  solver: euler
  normalized_action_clip: 10.0
  execution_steps: 2
  warm_start: false

training:
  seed: 101
  batch_size: 16
  sampling:
    strategy: coverage_then_temperature_without_replacement_cycles
    samples_per_epoch: auto
    coverage_epochs: 1
    temperature_alpha: 0.5
  num_workers: auto
  prefetch_factor: 4
  persistent_workers: true
  pin_memory: true
  multiprocessing_context: spawn
  in_order: false
  # The audited 11-task train split expands to about 138 GiB because current
  # and next 240x320 RGB tensors are distinct HDF5 fields. Keep formal M2
  # disk-backed on 64 GiB hosts and rely on worker prefetch plus the OS page
  # cache; full shared-RAM preload also exceeds the 32 GiB /dev/shm mount.
  preload_to_ram: false
  preload_shared_memory: false
  preload_max_available_fraction: 0.65
  precision: bf16
  torch_float32_matmul_precision: high
  allow_tf32: true
  cudnn_benchmark: true
  weight_decay: 0.00001
  gradient_clip_norm: 1.0
  executed_prefix_weight: 4.0
  warm_start_probability: 0.0
  warm_start_noise_std: 0.0
  stages:
    - name: 1_world_representation_warmup
      steps: 2000
      learning_rate: 0.0002
      losses:
        flow_matching: 0.0
        action_endpoint: 0.0
        action_smoothness: 0.0
        future_state: 1.0
        future_visual_latent: 1.0
    - name: 2_causal_action_flow
      steps: 4000
      learning_rate: 0.00015
      losses:
        flow_matching: 1.0
        action_endpoint: 12.0
        action_smoothness: 0.05
        future_state: 0.0
        future_visual_latent: 0.0
    - name: 3_joint_world_action
      steps: 14200
      learning_rate: 0.00008
      losses:
        flow_matching: 1.0
        action_endpoint: 12.0
        action_smoothness: 0.05
        future_state: 1.0
        future_visual_latent: 1.0

checkpoint:
  output: checkpoints/phase_m2_robofactory_multitask_seed101
  report: outputs/phase_m2_robofactory_multitask/training_report.json

rollout:
  closed_loop_tasks:
    - LiftBarrier-rf
    - TwoRobotsStackCube-rf
    - PassShoe-rf
    - LongPipelineDelivery-rf

name: wam.robofactory/lpd-static-dino-act-moe-latest-chunk
format_version: wam.robofactory.static_rgb_act_moe.config/1

data:
  manifests:
    - datasets/robofactory_multitask/lift_barrier/training_manifest.json
    - datasets/robofactory_multitask/long_pipeline_delivery/training_manifest.json
  stride: 1
  hdf5_cache_size: 4
  observation: existing_world_fixed_agent_rgb
  depth: false
  wrist_camera: false

vision:
  encoder_name: dinov3_vitl16_lvd
  model_id: facebook/dinov3-vitl16-pretrain-lvd1689m
  revision: dd0a398fa8e84f2a37179332f6c561d20276300b
  config_path: artifacts/vision/dinov3_vitl16_lvd/config.json
  weights_path: artifacts/vision/dinov3_vitl16_lvd/model.safetensors
  expected_config_sha256: ce962b0c8ca4f2deb48c6fdfd6035257e3769f1d4d9154c92aba51991e46e290
  expected_weights_sha256: dcb2e45127cccbf1601e5f42fef165eea275c8e5213197e8dcf3f48822718179
  preprocess_id: dinov3_imagenet_rgb_resize_rectangular_antialias_v2
  input_height: 480
  input_width: 640
  inference_batch_size: 2

model:
  state_dim: 18
  action_dim: 8
  horizon: 100
  vision_dim: 1024
  d_model: 384
  encoder_layers: 4
  decoder_layers: 7
  heads: 8
  ffn_dim: 1536
  latent_dim: 32
  experts: 4
  dropout: 0.1
  decoder_kind: sparse_moe
  dense_ffn_dim: 3072

training:
  seed: 20260727
  batch_size: 4
  num_workers: 4
  updates: 80000
  learning_rate: 0.0002
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  kl_weight: 0.001
  router_aux_weight: 0.01
  active_agent_weight: 4.0
  active_delta_threshold: 0.005
  save_interval: 1000

inference:
  # Reuse the full MoE checkpoint and select action zero from each new chunk.
  chunk_aggregation: latest_chunk
  temporal_ensemble_decay: 0.01
  normalized_action_clip: 10.0

checkpoint:
  output: checkpoints/lpd_static_dino_act_moe/checkpoint_080000.pt
  resume: checkpoints/lpd_static_dino_act_moe/resume.pt

[project]
name = "before-we-act"
version = "1.0.0"
description = "Learning multi-robot policies from predicted consequences"
requires-python = "==3.11.*"
dependencies = [
    "gymnasium>=1.3.0",
    "h5py>=3.16.0",
    "httpx[socks]>=0.28.1",
    "huggingface-hub==1.21.0",
    "mujoco>=3.10.0",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "safetensors>=0.8.0",
    "torch>=2.11.0",
    "transformers==5.12.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false
required-version = ">=0.9.0"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

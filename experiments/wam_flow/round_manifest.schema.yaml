$schema: https://json-schema.org/draft/2020-12/schema
$id: wam.robofactory.wam_flow.round_manifest/1
type: object
additionalProperties: false
required:
  - format_version
  - round_id
  - source_parent_commit
  - hypothesis
  - data
  - vision
  - training
  - validation
  - candidates
properties:
  format_version:
    const: wam.robofactory.wam_flow.round_manifest/1
  round_id:
    type: string
  source_parent_commit:
    type: string
    pattern: "^[0-9a-f]{40}$"
  hypothesis:
    type: string
  data:
    type: object
  vision:
    type: object
  training:
    type: object
  validation:
    type: object
  candidates:
    type: array
    minItems: 2
    uniqueItems: true
    items:
      type: string

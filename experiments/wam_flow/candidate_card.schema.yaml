$schema: https://json-schema.org/draft/2020-12/schema
$id: wam.robofactory.wam_flow.candidate_card/1
type: object
additionalProperties: false
required:
  - format_version
  - round_id
  - candidate_id
  - branch
  - source_parent_commit
  - hypothesis
  - changed_axis
  - unchanged_axes
  - rollback
  - runtime
properties:
  format_version:
    const: wam.robofactory.wam_flow.candidate_card/1
  round_id:
    type: string
  candidate_id:
    type: string
  branch:
    type: string
  source_parent_commit:
    type: string
    pattern: "^[0-9a-f]{40}$"
  hypothesis:
    type: string
  changed_axis:
    type: string
  unchanged_axes:
    type: array
    minItems: 1
    items:
      type: string
  rollback:
    type: object
  runtime:
    type: object

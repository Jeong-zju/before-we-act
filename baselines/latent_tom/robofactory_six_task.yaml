name: robofactory_six_task
image_shape: [3, 240, 320]

shape_meta: &shape_meta
  obs:
    camera_1:
      shape: ${task.image_shape}
      type: rgb
    camera_2:
      shape: ${task.image_shape}
      type: rgb
    camera_3:
      shape: ${task.image_shape}
      type: rgb
    camera_4:
      shape: ${task.image_shape}
      type: rgb
    arm1_robot_eef_pos:
      shape: [3]
      type: low_dim
    arm1_eef_quat:
      shape: [4]
      type: low_dim
    arm2_robot_eef_pos:
      shape: [3]
      type: low_dim
    arm2_eef_quat:
      shape: [4]
      type: low_dim
  arm1_action:
    shape: [8]
  arm2_action:
    shape: [8]

env_runner: null

dataset:
  _target_: diffusion_policy.dataset.robofactory_paired_zarr_dataset.RoboFactoryPairedZarrDataset
  zarr_path_0: /workspace/bwa-baselines-runs/dp/six_tasks_agent0.zarr
  zarr_path_1: /workspace/bwa-baselines-runs/latent_tom/six_tasks_agent1.zarr
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  seed: 20260820
  val_ratio: 0.02
  max_train_episodes: null

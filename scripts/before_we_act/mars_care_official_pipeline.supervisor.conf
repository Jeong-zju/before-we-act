[program:mars-care-official-pipeline]
command=/bin/bash /workspace/repos/care-official/scripts/before_we_act/run_mars_care_autonomous.sh
directory=/workspace/repos/care-official
autostart=false
autorestart=false
startretries=0
startsecs=1
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/runs/care_official_mars_v1/logs/formal_pipeline.supervisor.log
stderr_logfile=/workspace/runs/care_official_mars_v1/logs/formal_pipeline.supervisor.err.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
